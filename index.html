<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario Unidad 4: Medios de Transmisión</title>
<style>
  :root {
    --azul: #1e3a8a;
    --azul-claro: #3b82f6;
    --verde: #16a34a;
    --rojo: #dc2626;
    --fondo: #0f172a;
    --tarjeta: #ffffff;
    --texto: #1e293b;
    --gris: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0e7490 100%);
    background-size: 300% 300%;
    animation: fondo 18s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    color: var(--texto);
  }
  @keyframes fondo {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .contenedor { width: 100%; max-width: 720px; }

  header {
    text-align: center;
    color: #fff;
    margin-bottom: 20px;
    animation: caerArriba 0.8s ease both;
  }
  header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.3px; }
  header p { opacity: 0.85; font-size: 0.95rem; margin-top: 6px; }

  .barra-externa {
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .barra-interna {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #38bdf8, #22c55e);
    border-radius: 999px;
    transition: width 0.6s ease;
  }
  .info-progreso {
    display: flex;
    justify-content: space-between;
    color: #e0f2fe;
    font-size: 0.85rem;
    margin-bottom: 18px;
    font-weight: 600;
  }

  .tarjeta {
    background: var(--tarjeta);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    animation: entrar 0.5s ease both;
  }
  @keyframes entrar {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes caerArriba {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .etiqueta {
    display: inline-block;
    background: linear-gradient(90deg, var(--azul), var(--azul-claro));
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }
  .pregunta {
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.5;
    color: var(--azul);
    margin-bottom: 20px;
  }

  .opciones { display: grid; gap: 12px; }
  .opcion {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: #f1f5f9;
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 0.98rem;
    color: var(--texto);
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    animation: aparecer 0.4s ease both;
  }
  .opcion:nth-child(1) { animation-delay: 0.05s; }
  .opcion:nth-child(2) { animation-delay: 0.12s; }
  .opcion:nth-child(3) { animation-delay: 0.19s; }
  .opcion:nth-child(4) { animation-delay: 0.26s; }
  @keyframes aparecer {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .opcion:hover:not(:disabled) {
    background: #dbeafe;
    border-color: var(--azul-claro);
    transform: translateX(4px);
  }
  .letra {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #cbd5e1;
    color: #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.9rem;
    transition: background 0.3s ease;
  }
  .opcion:disabled { cursor: default; }
  .opcion.correcta {
    background: #dcfce7;
    border-color: var(--verde);
    animation: pulso 0.6s ease;
  }
  .opcion.correcta .letra { background: var(--verde); color: #fff; }
  .opcion.incorrecta {
    background: #fee2e2;
    border-color: var(--rojo);
    animation: sacudir 0.5s ease;
  }
  .opcion.incorrecta .letra { background: var(--rojo); color: #fff; }

  @keyframes pulso {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes sacudir {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .explicacion {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 0.95rem;
    line-height: 1.5;
    display: none;
    animation: entrar 0.4s ease both;
  }
  .explicacion.ok { display: block; background: #dcfce7; color: #14532d; border-left: 5px solid var(--verde); }
  .explicacion.mal { display: block; background: #fee2e2; color: #7f1d1d; border-left: 5px solid var(--rojo); }

  .acciones {
    display: flex;
    justify-content: flex-end;
    margin-top: 22px;
  }
  .btn {
    background: linear-gradient(90deg, var(--azul), var(--azul-claro));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 26px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(59,130,246,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
    opacity: 0;
    pointer-events: none;
  }
  .btn.visible { opacity: 1; pointer-events: auto; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(59,130,246,0.5); }

  .resultado { text-align: center; padding: 10px 0; }
  .emoji { font-size: 4rem; animation: rebotar 1.2s ease infinite; display: inline-block; }
  @keyframes rebotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }
  .puntaje {
    font-size: 3rem;
    font-weight: 900;
    color: var(--azul);
    margin: 12px 0 4px;
  }
  .mensaje { color: var(--gris); font-size: 1.05rem; margin-bottom: 22px; }
  .detalle-seccion {
    display: grid;
    gap: 10px;
    margin: 18px 0 26px;
    text-align: left;
  }
  .fila-seccion {
    background: #f8fafc;
    border-radius: 12px;
    padding: 12px 16px;
    animation: aparecer 0.5s ease both;
  }
  .fila-seccion strong { display: block; color: var(--azul); margin-bottom: 6px; font-size: 0.92rem; }
  .barra-mini {
    background: #e2e8f0;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
  }
  .barra-mini div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #38bdf8, #22c55e);
    border-radius: 999px;
    transition: width 1s ease;
  }

  .confeti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    border-radius: 3px;
    pointer-events: none;
    animation: caer linear forwards;
    z-index: 10;
  }
  @keyframes caer {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  footer {
    text-align: center;
    color: #bae6fd;
    font-size: 0.8rem;
    margin-top: 18px;
    opacity: 0.8;
  }
</style>

let indice = 0;
let aciertos = 0;
let respondida = false;
const seccionesStats = {};
const tarjeta = document.getElementById("tarjeta");
const barra = document.getElementById("barra");
const contador = document.getElementById("contador");
const aciertosTxt = document.getElementById("aciertos");

// Ordenar: las preguntas se muestran en orden
document.querySelector(".info-progreso span:first-child").textContent = "Pregunta 1 de " + preguntas.length;

function actualizarProgreso() {
  const pct = (indice / preguntas.length) * 100;
  barra.style.width = pct + "%";
  contador.textContent = "Pregunta " + (indice + 1) + " de " + preguntas.length;
  aciertosTxt.textContent = "Aciertos: " + aciertos;
}

function mostrarPregunta() {
  respondida = false;
  actualizarProgreso();
  const p = preguntas[indice];
  const letras = ["A", "B", "C", "D", "E", "F"];
  let html = `
    <span class="etiqueta">${p.sec}</span>
    <div class="pregunta">${p.q}</div>
    <div class="opciones">
      ${p.ops.map((op, i) => `
        <button class="opcion" data-i="${i}">
          <span class="letra">${letras[i]}</span>
          <span>${op}</span>
        </button>`).join("")}
    </div>
    <div class="explicacion" id="explicacion"></div>
    <div class="acciones">
      <button class="btn" id="siguiente">${indice === preguntas.length - 1 ? "Ver resultados" : "Siguiente"} →</button>
    </div>`;
  tarjeta.style.animation = "none";
  tarjeta.offsetHeight;
  tarjeta.style.animation = "";
  tarjeta.innerHTML = html;

  tarjeta.querySelectorAll(".opcion").forEach(btn => {
    btn.addEventListener("click", () => responder(btn));
  });
  document.getElementById("siguiente").addEventListener("click", siguiente);
}

function responder(btn) {
  if (respondida) return;
  respondida = true;
  const p = preguntas[indice];
  const elegida = parseInt(btn.dataset.i);
  const botones = tarjeta.querySelectorAll(".opcion");
  const sec = p.sec;
  if (!seccionesStats[sec]) seccionesStats[sec] = { ok: 0, total: 0 };
  seccionesStats[sec].total++;

  botones.forEach(b => b.disabled = true);
  botones[p.r].classList.add("correcta");

  const exp = document.getElementById("explicacion");
  if (elegida === p.r) {
    aciertos++;
    seccionesStats[sec].ok++;
    exp.className = "explicacion ok";
    exp.innerHTML = "✅ <strong>¡Correcto!</strong> " + p.exp;
    lanzarConfeti();
  } else {
    btn.classList.add("incorrecta");
    exp.className = "explicacion mal";
    exp.innerHTML = "❌ <strong>Incorrecto.</strong> La respuesta correcta es: " + p.ops[p.r] + ". " + p.exp;
  }
  aciertosTxt.textContent = "Aciertos: " + aciertos;
  document.getElementById("siguiente").classList.add("visible");
}

function siguiente() {
  indice++;
  if (indice < preguntas.length) {
    mostrarPregunta();
  } else {
    mostrarResultados();
  }
}

function mostrarResultados() {
  barra.style.width = "100%";
  contador.textContent = "Completado";
  aciertosTxt.textContent = "Aciertos: " + aciertos + " / " + preguntas.length;

  const pct = Math.round((aciertos / preguntas.length) * 100);
  let emoji = "🏆", msg = "¡Excelente dominio de la unidad!";
  if (pct < 60) { emoji = "📚"; msg = "Te recomiendo repasar los temas con más errores."; }
  else if (pct < 80) { emoji = "👍"; msg = "Buen trabajo, sigue reforzando."; }

  let filas = Object.keys(seccionesStats).map((sec, i) => {
    const s = seccionesStats[sec];
    const p2 = Math.round((s.ok / s.total) * 100);
    return `
      <div class="fila-seccion" style="animation-delay:${i * 0.08}s">
        <strong>${sec}: ${s.ok} / ${s.total} (${p2}%)</strong>
        <div class="barra-mini"><div data-w="${p2}"></div></div>
      </div>`;
  }).join("");

  tarjeta.innerHTML = `
    <div class="resultado">
      <div class="emoji">${emoji}</div>
      <div class="puntaje">${pct}%</div>
      <div class="mensaje">${aciertos} de ${preguntas.length} respuestas correctas. ${msg}</div>
      <div class="detalle-seccion">${filas}</div>
      <button class="btn visible" id="reiniciar">Reiniciar cuestionario</button>
    </div>`;

  setTimeout(() => {
    tarjeta.querySelectorAll(".barra-mini div").forEach(d => d.style.width = d.dataset.w + "%");
  }, 200);
  document.getElementById("reiniciar").addEventListener("click", reiniciar);
  for (let i = 0; i < 60; i++) setTimeout(lanzarConfeti, i * 40);
}

function reiniciar() {
  indice = 0; aciertos = 0;
  for (const k in seccionesStats) delete seccionesStats[k];
  mostrarPregunta();
}

function lanzarConfeti() {
  const colores = ["#38bdf8", "#22c55e", "#f59e0b", "#ef4444", "#a855f7", "#ffffff"];
  const c = document.createElement("div");
  c.className = "confeti";
  c.style.left = Math.random() * 100 + "vw";
  c.style.background = colores[Math.floor(Math.random() * colores.length)];
  c.style.animationDuration = (2 + Math.random() * 2) + "s";
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 4200);
}

mostrarPregunta();
</script>
