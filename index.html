<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario Unidad 4: Medios de Transmisión</title>
<style>
  :root { --card:#ffffff; --txt:#1e293b; --sub:#64748b; --opt:#f1f5f9; --opth:#dbeafe; --acento:#3b82f6; }
  body.oscuro { --card:#1e293b; --txt:#e2e8f0; --sub:#94a3b8; --opt:#334155; --opth:#475569; --acento:#38bdf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height:100vh; padding:24px 16px; color:#fff;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0e7490);
    background-size:300% 300%; animation:fondo 18s ease infinite;
    display:flex; justify-content:center; align-items:center; overflow-x:hidden;
  }
  body.oscuro { background:linear-gradient(135deg,#020617,#172554,#164e63); background-size:300% 300%; }
  @keyframes fondo { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  .blob { position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; z-index:-1; animation:flota 14s ease-in-out infinite; }
  .b1 { width:320px; height:320px; background:#38bdf8; top:-80px; left:-80px; }
  .b2 { width:280px; height:280px; background:#22c55e; bottom:-60px; right:-60px; animation-delay:-5s; }
  .b3 { width:200px; height:200px; background:#a855f7; top:40%; left:60%; animation-delay:-9s; }
  @keyframes flota { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(40px,-30px) scale(1.1)} 66%{transform:translate(-30px,40px) scale(.95)} }

  .contenedor { width:100%; max-width:740px; }
  header { display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:18px; animation:caerArriba .8s ease both; }
  header h1 { font-size:1.5rem; font-weight:800; }
  header p { opacity:.85; font-size:.92rem; margin-top:6px; }
  .tools { display:flex; gap:10px; margin-top:12px; }
  .tool { background:rgba(255,255,255,.2); border:none; border-radius:10px; padding:8px 14px; color:#fff; cursor:pointer; font-size:1rem; transition:transform .2s, background .2s; }
  .tool:hover { transform:scale(1.08); background:rgba(255,255,255,.35); }
  .tool:active { transform:scale(.92); }

  .card {
    background:var(--card); color:var(--txt); border-radius:22px; padding:28px;
    box-shadow:0 20px 50px rgba(0,0,0,.35); position:relative; overflow:hidden;
    transition:background .4s, color .4s;
  }
  .girar { animation:girar .55s cubic-bezier(.2,.8,.2,1) both; transform-origin:center; }
  @keyframes girar { from{transform:perspective(900px) rotateY(90deg); opacity:0} to{transform:perspective(900px) rotateY(0); opacity:1} }
  @keyframes caerArriba { from{opacity:0; transform:translateY(-20px)} to{opacity:1; transform:translateY(0)} }
  @keyframes aparecer { from{opacity:0; transform:translateX(-14px)} to{opacity:1; transform:translateX(0)} }
  @keyframes deslizar { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

  /* Configuración */
  .titulo-setup { font-size:1.4rem; color:var(--acento); margin-bottom:14px; }
  .label { font-weight:700; font-size:.9rem; color:var(--sub); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--opt); color:var(--txt); border:2px solid transparent; border-radius:999px; padding:8px 14px; cursor:pointer; font-size:.88rem; transition:transform .2s, background .25s, color .25s; }
  .chip:hover { transform:translateY(-2px); }
  .chip:active { transform:scale(.9); }
  .chip.on { background:linear-gradient(90deg,#1e3a8a,#3b82f6); color:#fff; box-shadow:0 6px 14px rgba(59,130,246,.35); }
  .switch { display:flex; align-items:center; gap:10px; margin-top:18px; cursor:pointer; color:var(--txt); font-weight:600; }
  .switch input { width:20px; height:20px; accent-color:var(--acento); cursor:pointer; }
  .hint { margin-top:14px; font-size:.82rem; color:var(--sub); }

  .btn { background:linear-gradient(90deg,#1e3a8a,#3b82f6); color:#fff; border:none; border-radius:12px; padding:12px 24px; font-size:1rem; font-weight:700; cursor:pointer; box-shadow:0 8px 20px rgba(59,130,246,.4); transition:transform .2s, box-shadow .2s, opacity .3s; }
  .btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 26px rgba(59,130,246,.5); }
  .btn:active:not(:disabled) { transform:scale(.96); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.grande { margin-top:24px; width:100%; font-size:1.1rem; padding:15px; }
  .btn.sec { background:#64748b; box-shadow:0 8px 20px rgba(100,116,139,.4); }
  .botones { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px; }

  /* Quiz */
  .meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .etiqueta { background:linear-gradient(90deg,#1e3a8a,#3b82f6); color:#fff; font-size:.75rem; font-weight:700; padding:5px 12px; border-radius:999px; letter-spacing:.4px; }
  .racha { font-weight:800; font-size:1rem; color:var(--sub); transition:color .3s; }
  .racha.activa { color:#f97316; }
  .pop { animation:pop .5s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.5)} 100%{transform:scale(1)} }
  .barra { height:10px; background:rgba(127,127,127,.2); border-radius:99px; overflow:hidden; }
  #progFill { height:100%; background:linear-gradient(90deg,#38bdf8,#22c55e); border-radius:99px; transition:width .5s ease; }
  .info { display:flex; justify-content:space-between; font-size:.82rem; font-weight:600; color:var(--sub); margin:8px 0 14px; }
  .timer { height:6px; background:rgba(127,127,127,.2); border-radius:99px; overflow:hidden; margin-bottom:16px; }
  #timerFill { height:100%; width:100%; background:linear-gradient(90deg,#22c55e,#facc15); transition:width .1s linear; }
  #timerFill.urgente { background:#ef4444; animation:parpadeo .5s infinite alternate; }
  @keyframes parpadeo { from{opacity:1} to{opacity:.4} }
  .pregunta { font-size:1.12rem; font-weight:700; line-height:1.5; color:var(--acento); margin-bottom:18px; }

  .opciones { display:grid; gap:10px; }
  .opcion { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--opt); color:var(--txt); border:2px solid transparent; border-radius:14px; padding:13px 14px; font-size:.97rem; cursor:pointer; transition:transform .2s, background .2s, border-color .2s, box-shadow .2s; animation:aparecer .4s ease both; }
  .opcion:hover:not(:disabled) { background:var(--opth); border-color:var(--acento); transform:translateX(5px); box-shadow:0 6px 14px rgba(59,130,246,.2); }
  .opcion:active:not(:disabled) { transform:scale(.98); }
  .opcion:disabled { cursor:default; }
  .letra { flex-shrink:0; width:32px; height:32px; border-radius:50%; background:rgba(127,127,127,.3); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.88rem; transition:background .3s, transform .3s; }
  .txt { flex:1; }
  .tecla { font-size:.72rem; opacity:.5; border:1px solid currentColor; border-radius:6px; padding:1px 6px; }
  .opcion.correcta { background:#dcfce7; color:#14532d; border-color:#16a34a; animation:pulso .6s ease; }
  .opcion.correcta .letra { background:#16a34a; color:#fff; transform:rotate(360deg); }
  .opcion.incorrecta { background:#fee2e2; color:#7f1d1d; border-color:#dc2626; animation:sacudir .5s ease; }
  .opcion.incorrecta .letra { background:#dc2626; color:#fff; }
  @keyframes pulso { 0%{transform:scale(1)} 40%{transform:scale(1.03)} 100%{transform:scale(1)} }
  @keyframes sacudir { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  .card.sacudir { animation:sacudirCard .45s ease; }
  @keyframes sacudirCard { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  .explicacion { display:none; margin-top:16px; padding:14px 16px; border-radius:12px; font-size:.94rem; line-height:1.5; }
  .explicacion.visible { display:block; animation:deslizar .4s ease both; }
  .explicacion.ok { background:#dcfce7; color:#14532d; border-left:5px solid #16a34a; }
  .explicacion.mal { background:#fee2e2; color:#7f1d1d; border-left:5px solid #dc2626; }
  .acciones { display:flex; justify-content:flex-end; margin-top:20px; }
  #sig { opacity:.4; }
  #sig.listo { opacity:1; animation:latido 1.2s ease infinite; }
  @keyframes latido { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

  /* Resultados */
  .resultado { text-align:center; }
  .emoji { font-size:4rem; display:inline-block; animation:rebotar 1.2s ease infinite; }
  @keyframes rebotar { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .ring { position:relative; width:160px; height:160px; margin:12px auto 4px; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:11; }
  .ring .fondo { stroke:var(--opt); }
  .ring .fg { stroke:#22c55e; stroke-linecap:round; transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1); }
  .ringtxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:900; color:var(--txt); }
  .mensaje { color:var(--sub); font-size:.98rem; margin-top:6px; }
  .msg { font-weight:700; color:var(--acento); margin-top:6px; }
  .detalle { display:grid; gap:10px; margin-top:20px; text-align:left; }
  .fila { background:var(--opt); border-radius:12px; padding:12px 14px; animation:aparecer .5s ease both; }
  .fila-top { display:flex; justify-content:space-between; font-weight:600; margin-bottom:7px; font-size:.92rem; }
  .barra-mini { height:8px; background:rgba(127,127,127,.2); border-radius:99px; overflow:hidden; }
  .barra-mini div { height:100%; width:0; background:linear-gradient(90deg,#38bdf8,#22c55e); border-radius:99px; transition:width 1s ease; }

  /* Efectos */
  .chispa { position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:50; animation:chispa .8s ease-out forwards; }
  @keyframes chispa { to { transform:translate(var(--dx), var(--dy)) scale(0); opacity:0; } }
  #confeti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:40; }
  .papel { position:fixed; top:-20px; width:9px; height:13px; border-radius:2px; animation:caer linear forwards; }
  @keyframes caer { to { transform:translateY(110vh) rotate(720deg); opacity:0; } }

  footer { text-align:center; color:#bae6fd; font-size:.8rem; margin-top:18px; opacity:.85; }
  @media (max-width:520px) { .card { padding:20px; } .pregunta { font-size:1.02rem; } }
</style>
</head>

// ===== Estado y configuración =====
const SECS = [...new Set(DATA.map(d => d[0]))];
const cfg = { n: 0, secs: [], timer: false, sonido: true };
let deck = [], pos = 0, score = 0, streak = 0, best = 0;
let respondida = false, errores = [], respuestas = [];
let timerId = null, tiempo = 20, pantalla = "setup";
let audioCtx = null;
const app = document.getElementById("app");

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function armar(items) {
  return shuffle(items.map(it => ({ s: it[0], q: it[1], c: it[2], w: it[3], e: it[4] })))
    .map(it => {
      const opts = shuffle([it.c, ...it.w]);
      return { ...it, opts, ans: opts.indexOf(it.c) };
    });
}

// ===== Pantallas =====
function renderSetup() {
  pantalla = "setup";
  stopTimer();
  app.innerHTML = `
    <div class="card girar">
      <h2 class="titulo-setup">Configura tu sesión</h2>
      <p class="label">Número de preguntas</p>
      <div class="chips" data-g="n">
        ${[10, 20, 40, 0].map(v => `<button class="chip ${cfg.n === v ? "on" : ""}" data-v="${v}">${v || "Todas"}</button>`).join("")}
      </div>
      <p class="label">Secciones (ninguna = todas)</p>
      <div class="chips" data-g="sec">
        ${SECS.map(s => `<button class="chip ${cfg.secs.includes(s) ? "on" : ""}" data-v="${s}">${s}</button>`).join("")}
      </div>
      <label class="switch"><input type="checkbox" id="chkTimer" ${cfg.timer ? "checked" : ""}> Temporizador de 20 s por pregunta</label>
      <button class="btn grande" id="empezar">Comenzar ▶</button>
      <p class="hint">Atajos: 1–4 o A–D para responder · Enter para avanzar</p>
    </div>`;
}

function iniciar(items) {
  const pool = armar(items);
  deck = cfg.n && !items.repaso ? pool.slice(0, cfg.n) : pool;
  pos = 0; score = 0; streak = 0; errores = []; respuestas = [];
  pantalla = "quiz";
  renderPregunta(true);
}

function renderPregunta(anim) {
  respondida = false;
  const it = deck[pos];
  app.innerHTML = `
    <div class="card ${anim ? "girar" : ""}" id="card">
      <div class="meta">
        <span class="etiqueta">${it.s}</span>
        <span class="racha ${streak >= 3 ? "activa" : ""}" id="racha">Racha ${streak}</span>
      </div>
      <div class="barra"><div id="progFill" style="width:${(pos / deck.length) * 100}%"></div></div>
      <div class="info"><span>Pregunta ${pos + 1} de ${deck.length}</span><span id="infoAciertos">Aciertos ${score}</span></div>
      ${cfg.timer ? `<div class="timer"><div id="timerFill"></div></div>` : ""}
      <div class="pregunta">${it.q}</div>
      <div class="opciones">
        ${it.opts.map((o, i) => `
          <button class="opcion" data-i="${i}" style="animation-delay:${i * 70}ms">
            <span class="letra">${"ABCD"[i]}</span>
            <span class="txt">${o}</span>
            <span class="tecla">${i + 1}</span>
          </button>`).join("")}
      </div>
      <div class="explicacion" id="expl"></div>
      <div class="acciones"><button class="btn" id="sig" disabled>${pos === deck.length - 1 ? "Ver resultados" : "Siguiente"} →</button></div>
    </div>`;
  startTimer();
}

function responder(i) {
  if (respondida) return;
  respondida = true;
  stopTimer();
  const it = deck[pos];
  const ok = i === it.ans;
  const btns = [...document.querySelectorAll(".opcion")];
  btns.forEach(b => b.disabled = true);
  btns[it.ans].classList.add("correcta");
  const card = document.getElementById("card");

  if (ok) {
    score++; streak++; best = Math.max(best, streak);
    burst(btns[i]);
    if (streak >= 3 && streak % 3 === 0) repetirPop(document.getElementById("racha"));
  } else {
    streak = 0;
    errores.push(it);
    if (i >= 0) btns[i].classList.add("incorrecta");
    card.classList.add("sacudir");
  }
  sonar(ok);
  respuestas.push({ s: it.s, ok });

  const ex = document.getElementById("expl");
  ex.className = "explicacion visible " + (ok ? "ok" : "mal");
  ex.innerHTML = ok
    ? `<b>Correcto.</b> ${it.e}`
    : `${i < 0 ? "<b>Tiempo agotado.</b>" : "<b>Incorrecto.</b>"} Respuesta: <b>${it.c}</b>. ${it.e}`;

  const r = document.getElementById("racha");
  r.textContent = "Racha " + streak;
  r.classList.toggle("activa", streak >= 3);
  document.getElementById("infoAciertos").textContent = "Aciertos " + score;
  const sig = document.getElementById("sig");
  sig.disabled = false;
  sig.classList.add("listo");
}

function siguiente() {
  if (!respondida) return;
  pos++;
  if (pos < deck.length) renderPregunta(true);
  else renderResultados();
}

function renderResultados() {
  pantalla = "fin";
  stopTimer();
  const total = deck.length;
  const pct = total ? Math.round((score / total) * 100) : 0;
  const msg = pct >= 90 ? "¡Dominio excelente de la unidad!"
    : pct >= 70 ? "Muy buen trabajo; repasa tus errores."
    : pct >= 50 ? "Buen intento; refuerza los casos prácticos."
    : "Repasa las secciones y vuelve a intentarlo.";

  const stats = {};
  respuestas.forEach(r => {
    stats[r.s] = stats[r.s] || { ok: 0, t: 0 };
    stats[r.s].t++;
    if (r.ok) stats[r.s].ok++;
  });
  const filas = Object.entries(stats).map(([s, v], i) => {
    const p = Math.round((v.ok / v.t) * 100);
    return `<div class="fila" style="animation-delay:${i * 60}ms">
      <div class="fila-top"><span>${s}</span><b>${v.ok}/${v.t} (${p}%)</b></div>
      <div class="barra-mini"><div data-w="${p}"></div></div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="card girar resultado">
      <div class="ring">
        <svg viewBox="0 0 120 120">
          <circle class="fondo" cx="60" cy="60" r="54"></circle>
          <circle class="fg" id="aro" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="339.3"></circle>
        </svg>
        <div class="ringtxt"><span id="pctTxt">0%</span></div>
      </div>
      <p class="mensaje">${score} de ${total} correctas · Mejor racha: ${best}</p>
      <p class="msg">${msg}</p>
      <div class="detalle">${filas}</div>
      <div class="botones">
        <button class="btn" id="repasar" ${errores.length ? "" : "disabled"}>Repasar ${errores.length} error${errores.length === 1 ? "" : "es"}</button>
        <button class="btn sec" id="nuevo">Nuevo cuestionario</button>
      </div>
    </div>`;

  setTimeout(() => {
    document.getElementById("aro").style.strokeDashoffset = 339.3 * (1 - pct / 100);
    document.querySelectorAll(".barra-mini div").forEach(d => d.style.width = d.dataset.w + "%");
    let c = 0;
    const iv = setInterval(() => {
      c += 2;
      if (c >= pct) { c = pct; clearInterval(iv); }
      document.getElementById("pctTxt").textContent = c + "%";
    }, 25);
    if (pct >= 60) lanzarConfeti(90);
  }, 150);
}

// ===== Temporizador =====
function startTimer() {
  if (!cfg.timer) return;
  stopTimer();
  tiempo = 20;
  timerId = setInterval(() => {
    tiempo -= 0.1;
    const f = document.getElementById("timerFill");
    if (f) {
      f.style.width = (tiempo / 20) * 100 + "%";
      if (tiempo <= 5) f.classList.add("urgente");
    }
    if (tiempo <= 0) { stopTimer(); responder(-1); }
  }, 100);
}
function stopTimer() { clearInterval(timerId); timerId = null; }

// ===== Efectos =====
function burst(el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colores = ["#22c55e", "#38bdf8", "#facc15", "#f472b6", "#a78bfa"];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("span");
    s.className = "chispa";
    const a = (Math.PI * 2 * i) / 16;
    const d = 40 + Math.random() * 50;
    s.style.left = cx + "px";
    s.style.top = cy + "px";
    s.style.background = colores[i % colores.length];
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }
}

function repetirPop(el) {
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
}

function lanzarConfeti(n) {
  const cont = document.getElementById("confeti");
  const cols = ["#38bdf8", "#22c55e", "#f59e0b", "#ef4444", "#a855f7", "#ffffff"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("i");
    d.className = "papel";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = cols[Math.floor(Math.random() * cols.length)];
    d.style.animationDuration = (2.5 + Math.random() * 2) + "s";
    d.style.animationDelay = (Math.random() * 0.6) + "s";
    cont.appendChild(d);
    setTimeout(() => d.remove(), 5000);
  }
}

function sonar(ok) {
  if (!cfg.sonido) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const t = audioCtx.currentTime;
    o.type = "sine";
    o.frequency.setValueAtTime(ok ? 660 : 180, t);
    if (ok) o.frequency.exponentialRampToValueAtTime(990, t + 0.15);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.3);
  } catch (e) { /* sin audio disponible */ }
}

// ===== Eventos =====
app.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) {
    const grupo = chip.parentElement.dataset.g;
    if (grupo === "n") {
      cfg.n = Number(chip.dataset.v);
      chip.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
    } else {
      const v = chip.dataset.v;
      cfg.secs = cfg.secs.includes(v) ? cfg.secs.filter(x => x !== v) : [...cfg.secs, v];
      chip.classList.toggle("on");
    }
    chip.animate([{ transform: "scale(.85)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 300 });
    return;
  }
  if (e.target.closest("#empezar")) {
    const base = cfg.secs.length ? DATA.filter(d => cfg.secs.includes(d[0])) : DATA;
    iniciar(base);
    return;
  }
  const op = e.target.closest(".opcion");
  if (op && !respondida) { responder(Number(op.dataset.i)); return; }
  if (e.target.closest("#sig")) { siguiente(); return; }
  if (e.target.closest("#repasar")) {
    deck = armar(errores.map(x => [x.s, x.q, x.c, x.w, x.e]));
    pos = 0; score = 0; streak = 0; errores = []; respuestas = [];
    pantalla = "quiz";
    renderPregunta(true);
    return;
  }
  if (e.target.closest("#nuevo")) { renderSetup(); }
});

app.addEventListener("change", e => {
  if (e.target.id === "chkTimer") cfg.timer = e.target.checked;
});

document.addEventListener("keydown", e => {
  if (pantalla !== "quiz") return;
  const k = e.key.toLowerCase();
  const mapa = { "1": 0, "2": 1, "3": 2, "4": 3, "a": 0, "b": 1, "c": 2, "d": 3 };
  if (k in mapa && !respondida) {
    if (document.querySelectorAll(".opcion")[mapa[k]]) responder(mapa[k]);
  } else if ((k === "enter" || k === " ") && respondida) {
    e.preventDefault();
    siguiente();
  }
});


iniciar(DATA);
</script>
</body>
